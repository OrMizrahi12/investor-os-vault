# Sums the script works, from the reads. on_file is the figure in the approved inputs or the kill note.
calcs = [
  { id = "earn_high", what = "Normal earnings, twelve months", on_file = 2051, formula = "ni_fy + ni_ytd - ni_prior + (trans_fy - trans_prior + trans_ytd) - (unreal_fy - unreal_prior + unreal_ytd) + (sales_fy - sales_prior + sales_ytd)", rests_on = "Earnings high" },
  { id = "fcf", what = "Free cash flow, twelve months", on_file = 2461, formula = "ocf_fy + ocf_ytd - ocf_prior - (capex_fy + capex_ytd - capex_prior)", rests_on = "Cash" },
  { id = "cash_high", what = "Cash, whole filed line out", on_file = 1505, formula = "fcf - (line_fy + line_ytd - line_prior)", rests_on = "Cash high, K5" },
  { id = "cash_low", what = "Cash, only deposits received out", on_file = 971, formula = "fcf - (got_fy + got_ytd - got_prior)", rests_on = "Cash low" },
  { id = "cash_mid", what = "Cash, both sides out, an estimate", on_file = 1256, formula = "cash_low + used_fy + used_ytd - used_prior", rests_on = "Cash middle" },
  { id = "run_rate", what = "Core sales × 4 (K4's reading)", on_file = 20324, formula = "core_q * 4", rests_on = "K4, plan scenario" },
  { id = "opt_margin", what = "Optical margin, the quarter", on_file = 0.22362337116435477, formula = "opt_ni / opt_sales", rests_on = "K3, scenarios" },
  { id = "opt_margin_last_q", what = "Optical margin, the quarter before", on_file = 0.21138996138996138, formula = "opt_ni_last_q / opt_sales_last_q", rests_on = "K3" },
  { id = "opt_capital", what = "Optical assets ÷ twelve-month sales", on_file = 0.6300325081270317, formula = "opt_assets / (opt_ytd_sales + opt_rest)", rests_on = "Scenarios" },
  { id = "solar_capital", what = "Solar assets ÷ twelve-month sales", on_file = 1.8417684700407213, formula = "solar_assets / (solar_ytd_sales + solar_rest)", rests_on = "Solar scenario" },
  { id = "margin_cut", what = "Optical margin less the low quarter's", on_file = 0.04431708074695323, formula = "opt_margin - opt_low_ni / opt_low_sales", rests_on = "Rival downside" },
  { id = "glass_after_tax", what = "Glass: share of profit kept after tax", on_file = 0.7903614457831325, formula = "glass_ni / (glass_ni + glass_tax)", rests_on = "Display scenario" },
  { id = "solar_new_sales", what = "Solar: $3,000M target less the quarter × 4", on_file = 1256, formula = "3000 - solar_q_sales * 4", rests_on = "Solar scenario" },
  { id = "solar_new_profit", what = "Solar: $3,000M × group margin, plus the quarter's loss × 4", on_file = 448.1853759011329, formula = "3000 * gaap_q_ni / gaap_q_sales - solar_q_ni * 4", rests_on = "Solar scenario" },
  { id = "plan_new_sales", what = "Plan: $35,000M less run rate and the signed, Solar and Display rows", on_file = 9985.15, formula = "35000 - run_rate - 3250 - solar_new_sales - display_fy * 0.05", rests_on = "Plan scenario" },
]

