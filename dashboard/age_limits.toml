# My age limits for the board's sources. Approved by me, Nov. 4, 2026, as Claude proposed them. Changing one needs my approval, and a test holds these values.
#
# Past a limit the board says so in words, with how old the source is. No colour, no level, no alert, because a source's age alone is never an alert
# (Rules/alerts.md). 110 days comes from the longest gap, 105 days, between Corning's last 13 10-Q and 10-K filings (calc., sensors/edgar/cache/CIK0000024741/filings.jsonl, saved Nov. 3, 2026).
#
# No limit, the date alone shows: a past fact with its dated source, the Journal, Lessons, decision files, the rejection log, and the Inbox's 8-K notes.
# No new 8-K is not an old source, and the filing list's own age covers that. The 10-year Treasury file has none either: it is saved and no screen shows it.

